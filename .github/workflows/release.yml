name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build, publish, package
        shell: pwsh
        run: |
          $inputTag = "${{ github.event.inputs.tag }}"
          $refName = "${{ github.ref_name }}"

          if ($inputTag) {
            $tag = $inputTag
          } elseif ($refName -like "v*") {
            $tag = $refName
          } else {
            [xml]$proj = Get-Content i3wsb.csproj
            $v = $proj.Project.PropertyGroup.Version
            if (-not $v) { $v = "0.2.0" }
            $tag = "v$v"
          }

          $ver = $tag.TrimStart('v')
          Write-Host "Building $tag ($ver)"
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

          dotnet publish -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true `
            -p:Version=$ver `
            -o publish --nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $files = "i3wsb.exe", "VirtualDesktopAccessor.dll", "README.md", "LICENSE", "THIRD_PARTY.md"
          Copy-Item README.md, LICENSE, THIRD_PARTY.md publish/
          foreach ($f in $files) {
            if (-not (Test-Path "publish/$f")) { throw "missing publish/$f" }
          }
          $zip = "i3wsb-$tag-win-x64.zip"
          Compress-Archive -Path ($files | ForEach-Object { "publish/$_" }) -DestinationPath $zip -Force
          Get-ChildItem publish, $zip | Format-Table Name, Length

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: i3wsb ${{ env.RELEASE_TAG }}
          files: i3wsb-*-win-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Self-contained build — no .NET runtime install needed.

            **Run:** unzip anywhere, launch `i3wsb.exe`. Keep `VirtualDesktopAccessor.dll` next to it.
            **Requires:** Windows 11 (recent build) x64.
